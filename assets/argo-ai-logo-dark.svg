<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 175" role="img" aria-labelledby="title desc"><title id="title">ARGO AI</title><desc id="desc">ARGO AI logo for dark backgrounds, built to the ARGO AI brand board: the ARGO AI glyph (solid four point star) in the Argo gradient (Argo Teal #0E7C7A to Argo Purple #7A4CFF to #7AACFF, brand board sections 13 and 14) beside the ARGO AI wordmark, ARGO in white, AI in the Argo purple gradient. This is the ARGO AI mark, not the Argo sail platform mark.</desc><defs><linearGradient id="brand" x1="0.35" y1="1" x2="0.65" y2="0"><stop stop-color="#0E7C7A"/><stop offset=".3" stop-color="#0E7C7A"/><stop offset=".62" stop-color="#7A4CFF"/><stop offset="1" stop-color="#7AACFF"/></linearGradient><linearGradient id="aigrad" x1="0" y1="1" x2="0.4" y2="0"><stop stop-color="#7A4CFF"/><stop offset="1" stop-color="#7AACFF"/></linearGradient></defs><path d="M90 2 C95 48 104 74 138 88 C104 102 95 128 90 174 C85 128 76 102 42 88 C76 74 85 48 90 2Z" fill="url(#brand)"/><text x="215" y="127" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="600" letter-spacing="4" fill="#fff">ARGO</text><text x="584" y="127" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="600" letter-spacing="1" fill="url(#aigrad)">AI</text></svg>

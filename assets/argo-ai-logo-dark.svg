<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 175" role="img" aria-labelledby="title desc"><title id="title">ARGO AI</title><desc id="desc">ARGO AI logo for dark backgrounds, matching the ARGO AI lockup as used on the smart glasses posters (no subtext): outline four point glyph with a violet to cyan gradient stroke, ARGO in white with the teal sail inside the crossbarless A, AI in a violet to blue gradient.</desc><defs><linearGradient id="symbol" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#08b5e2"/><stop offset=".5" stop-color="#5553f4"/><stop offset="1" stop-color="#8d37df"/></linearGradient><linearGradient id="aigrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#791fe6"/><stop offset="1" stop-color="#2e9bff"/></linearGradient></defs><g transform="translate(90 88) scale(0.78) translate(-90 -88)"><path d="M90 12 C98 61 115 78 166 88 C115 98 98 115 90 164 C82 115 65 98 14 88 C65 78 82 61 90 12Z" fill="none" stroke="url(#symbol)" stroke-width="8" stroke-linejoin="round"/></g><path d="M214 127 L252 44 L290 127 L270 127 L252 82 L234 127Z" fill="#fff"/><path d="M236 125 C238 106 244 93 258 84 C251 99 250 111 254 120 C249 125 240 127 236 125Z" fill="#0E7C7A"/><text x="300" y="127" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="600" letter-spacing="4" fill="#fff">RGO</text><path d="M600 127 L632 44 L664 127 L650 127 L632 82 L614 127Z" fill="url(#aigrad)"/><rect x="674" y="44" width="14" height="83" fill="url(#aigrad)"/></svg>
